<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>♟ Chess Arena — Play Chess Online</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

    <div id="app">
        <!-- ===== NAVBAR ===== -->
        <nav id="navbar">
            <div class="nav-container">
                <div class="nav-brand" onclick="navigate('home')">
                    <span class="brand-icon">♟</span>
                    <span class="brand-text">Chess Arena</span>
                </div>
                <div class="nav-links" id="navLinks">
                    <a href="#" class="nav-link active" data-page="home">Home</a>
                    <a href="#" class="nav-link" data-page="computer">Play AI</a>
                    <a href="#" class="nav-link" data-page="online">Online</a>
                    <a href="#" class="nav-link" data-page="leaderboard">Leaderboard</a>
                    <a href="#" class="nav-link" data-page="profile">Profile</a>
                </div>
                <div class="nav-actions">
                    <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
                    <button id="authBtn" class="btn btn-primary btn-sm">Login</button>
                </div>
                <button id="mobileMenuBtn" class="icon-btn mobile-menu-btn">☰</button>
            </div>
        </nav>

        <!-- ===== MAIN CONTENT ===== -->
        <main id="mainContent">
            <div id="pageContainer"></div>
        </main>

        <!-- ===== TOAST ===== -->
        <div id="toastContainer" class="toast-container"></div>

        <!-- ===== MODAL ===== -->
        <div id="modalContainer" class="modal-container" style="display:none;"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
